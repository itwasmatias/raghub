<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIP Markets</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #080b12;
            --panel: #111722;
            --panel-2: #171f2d;
            --border: #293448;
            --text: #f4f7fb;
            --muted: #9aa8bc;
            --positive: #4ade80;
            --negative: #fb7185;
            --accent: #60a5fa;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, #172554 0, transparent 35%),
                var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        button, input, select { font: inherit; }

        .page {
            width: min(1480px, calc(100% - 28px));
            margin: 0 auto;
            padding: 24px 0 48px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 22px;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 4vw, 3rem);
        }

        .subtitle {
            margin: 8px 0 0;
            color: var(--muted);
        }

        .controls {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) auto;
            gap: 12px;
            margin-bottom: 16px;
        }

        #market-search,
        #status-filter {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel);
            color: var(--text);
            padding: 12px 14px;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .filter-button {
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--panel);
            color: var(--muted);
            padding: 8px 14px;
            cursor: pointer;
        }

        .filter-button[aria-pressed="true"] {
            background: var(--accent);
            border-color: var(--accent);
            color: #07111f;
            font-weight: 700;
        }

        .summary {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            color: var(--muted);
            margin-bottom: 14px;
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(315px, 1fr));
            gap: 14px;
        }

        .market-card {
            border: 1px solid var(--border);
            border-radius: 14px;
            background: linear-gradient(145deg, var(--panel), var(--panel-2));
            overflow: hidden;
            box-shadow: 0 12px 32px rgb(0 0 0 / 24%);
        }

        .card-header,
        .card-body,
        .card-footer {
            padding: 14px 16px;
        }

        .card-header {
            border-bottom: 1px solid var(--border);
        }

        .card-footer {
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 10px;
        }

        .badge {
            border: 1px solid var(--border);
            border-radius: 999px;
            color: var(--muted);
            padding: 4px 8px;
            font-size: .75rem;
            text-transform: uppercase;
        }

        .event-title {
            margin: 0;
            font-size: 1.05rem;
            line-height: 1.4;
        }

        .closing-time {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: .84rem;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
        }

        .metric {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgb(0 0 0 / 18%);
            padding: 10px;
        }

        .metric-label {
            display: block;
            color: var(--muted);
            font-size: .75rem;
            margin-bottom: 5px;
        }

        .metric-value {
            font-weight: 700;
        }

        .positive { color: var(--positive); }
        .negative { color: var(--negative); }

        .outcomes {
            margin-top: 12px;
            display: grid;
            gap: 7px;
        }

        .outcome-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            border-top: 1px solid var(--border);
            padding-top: 8px;
        }

        .unavailable {
            margin-top: 12px;
            border: 1px dashed var(--border);
            border-radius: 9px;
            color: var(--muted);
            padding: 10px;
            text-align: center;
        }

        .watch-button,
        .intelligence-link {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            padding: 8px 10px;
            text-decoration: none;
            cursor: pointer;
        }

        .watch-button.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .state-panel {
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--panel);
            padding: 36px 20px;
            text-align: center;
            color: var(--muted);
        }

        @media (max-width: 680px) {
            .topbar,
            .summary {
                flex-direction: column;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .page {
                width: min(100% - 18px, 1480px);
                padding-top: 16px;
            }
        }
    </style>
</head>
<body>
<main class="page">
    <header class="topbar">
        <div>
            <h1>SIP Markets</h1>
            <p class="subtitle">
                Unified sports and prediction-market intelligence board
            </p>
        </div>
        <a class="intelligence-link" href="/sip/markets">
            Refresh board
        </a>
    </header>

    <section aria-label="Market controls">
        <div class="controls">
            <label>
                <span class="metric-label">Search markets</span>
                <input
                    id="market-search"
                    type="search"
                    placeholder="Search teams, events, or leagues"
                    autocomplete="off">
            </label>

            <label>
                <span class="metric-label">Event status</span>
                <select id="status-filter">
                    <option value="all">All statuses</option>
                    <option value="live">Live</option>
                    <option value="upcoming">Upcoming</option>
                </select>
            </label>
        </div>

        <div id="league-filters" class="filter-row" aria-label="League filters">
            <button class="filter-button" data-league="ALL" aria-pressed="true">All</button>
            <button class="filter-button" data-league="MLB" aria-pressed="false">MLB</button>
            <button class="filter-button" data-league="NBA" aria-pressed="false">NBA</button>
            <button class="filter-button" data-league="WNBA" aria-pressed="false">WNBA</button>
            <button class="filter-button" data-league="NFL" aria-pressed="false">NFL</button>
        </div>
    </section>

    <div class="summary">
        <span id="market-count">Loading markets…</span>
        <span>Watchlist is stored locally in this browser.</span>
    </div>

    <section id="market-grid" class="market-grid" aria-live="polite">
        <div class="state-panel">Loading market intelligence…</div>
    </section>
</main>

<script>
(() => {
    "use strict";

    const API_URL = "/api/sip/markets";
    const WATCHLIST_KEY = "sip-market-watchlist";

    const grid = document.getElementById("market-grid");
    const count = document.getElementById("market-count");
    const search = document.getElementById("market-search");
    const statusFilter = document.getElementById("status-filter");
    const leagueButtons = [...document.querySelectorAll("[data-league]")];

    let markets = [];
    let activeLeague = "ALL";
    let watchlist = new Set();

    try {
        watchlist = new Set(
            JSON.parse(localStorage.getItem(WATCHLIST_KEY) || "[]")
        );
    } catch {
        watchlist = new Set();
    }

    const firstDefined = (...values) =>
        values.find(value => value !== undefined && value !== null && value !== "");

    const numberValue = value => {
        if (value === null || value === undefined) return null;
        if (typeof value === "string" && value.trim() === "") return null;
        const number = Number(value);
        return Number.isFinite(number) ? number : null;
    };

    const probability = value => {
        const number = numberValue(value);
        if (number === null) return null;
        const normalized = Math.abs(number) <= 1 ? number * 100 : number;
        return `${normalized.toFixed(1)}%`;
    };

    const signedPercent = value => {
        const number = numberValue(value);
        if (number === null) return "Unavailable";
        const normalized = Math.abs(number) <= 1 ? number * 100 : number;
        return `${normalized >= 0 ? "+" : ""}${normalized.toFixed(1)}%`;
    };

    const text = value =>
        String(firstDefined(value, "Unavailable"));

    const escapeHtml = value =>
        text(value).replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[character]);

    function normalizePayload(payload) {
        if (Array.isArray(payload)) return payload;

        for (const key of ["markets", "events", "items", "results", "data"]) {
            if (Array.isArray(payload?.[key])) return payload[key];
        }

        return [];
    }

    function marketId(market, index) {
        return String(firstDefined(
            market.id,
            market.market_id,
            market.event_id,
            market.fixture_id,
            `market-${index}`
        ));
    }

    function marketLeague(market) {
        return text(firstDefined(
            market.league,
            market.sport,
            market.competition,
            "Unknown"
        )).toUpperCase();
    }

    function marketStatus(market) {
        return text(firstDefined(
            market.status,
            market.event_status,
            market.state,
            "upcoming"
        )).toLowerCase();
    }

    function marketTitle(market) {
        return text(firstDefined(
            market.title,
            market.name,
            market.event_name,
            market.matchup,
            market.question,
            [
                firstDefined(market.away_team, market.away),
                firstDefined(market.home_team, market.home)
            ].filter(Boolean).join(" at "),
            "Untitled market"
        ));
    }

    function renderOutcomes(market) {
        const outcomes = Array.isArray(market.outcomes)
            ? market.outcomes
            : [];

        if (!outcomes.length) return "";

        return `
            <div class="outcomes">
                ${outcomes.slice(0, 4).map(outcome => `
                    <div class="outcome-row">
                        <span>${escapeHtml(firstDefined(
                            outcome.name,
                            outcome.label,
                            outcome.team,
                            "Outcome"
                        ))}</span>
                        <strong>${escapeHtml(firstDefined(
                            probability(firstDefined(
                                outcome.probability,
                                outcome.implied_probability,
                                outcome.price
                            )),
                            outcome.odds,
                            "Unavailable"
                        ))}</strong>
                    </div>
                `).join("")}
            </div>
        `;
    }

    function renderCard(market, index) {
        const id = marketId(market, index);
        const league = marketLeague(market);
        const status = marketStatus(market);

        const sportsbook = probability(firstDefined(
            market.sportsbook_implied_probability,
            market.implied_probability,
            market.market_probability,
            market.book_probability
        ));

        const model = probability(firstDefined(
            market.model_probability,
            market.sip_probability,
            market.predicted_probability,
            market.forecast_probability
        ));

        const predictionMarket = probability(firstDefined(
            market.prediction_market_probability,
            market.consensus_probability,
            market.exchange_probability
        ));

        const edgeNumber = numberValue(firstDefined(
            market.edge,
            market.model_edge,
            market.value_edge
        ));

        const edge = signedPercent(edgeNumber);

        const expectedValue = signedPercent(firstDefined(
            market.expected_value,
            market.ev,
            market.expected_return
        ));

        const confidence = firstDefined(
            probability(market.confidence),
            market.confidence_label,
            market.qualification,
            "Unqualified"
        );

        const closing = firstDefined(
            market.closing_time,
            market.start_time,
            market.commence_time,
            market.scheduled_at,
            "Closing time unavailable"
        );

        const watched = watchlist.has(id);
        const edgeClass = edgeNumber === null
            ? ""
            : edgeNumber >= 0 ? "positive" : "negative";

        const intelligenceId = firstDefined(
            market.event_id,
            market.fixture_id,
            market.id
        );

        const intelligenceLink = intelligenceId
            ? `<a class="intelligence-link"
                   href="/sip/markets?event_id=${encodeURIComponent(intelligenceId)}">
                   View Intelligence
               </a>`
            : `<span class="metric-label">Intelligence ID unavailable</span>`;

        return `
            <article class="market-card" data-market-id="${escapeHtml(id)}">
                <header class="card-header">
                    <div class="badges">
                        <span class="badge">${escapeHtml(league)}</span>
                        <span class="badge">${escapeHtml(status)}</span>
                    </div>
                    <h2 class="event-title">${escapeHtml(marketTitle(market))}</h2>
                    <p class="closing-time">
                        Closing time: ${escapeHtml(closing)}
                    </p>
                </header>

                <div class="card-body">
                    <div class="metric-grid">
                        <div class="metric">
                            <span class="metric-label">Sportsbook implied</span>
                            <span class="metric-value">${escapeHtml(sportsbook || "Unavailable")}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">SIP model</span>
                            <span class="metric-value">${escapeHtml(model || "Unavailable")}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Edge</span>
                            <span class="metric-value ${edgeClass}">${escapeHtml(edge)}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Expected value</span>
                            <span class="metric-value">${escapeHtml(expectedValue)}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Confidence / qualification</span>
                            <span class="metric-value">${escapeHtml(confidence)}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Prediction market</span>
                            <span class="metric-value">${escapeHtml(predictionMarket || "Unavailable")}</span>
                        </div>
                    </div>

                    ${predictionMarket ? "" : `
                        <div class="unavailable">
                            Prediction market unavailable
                        </div>
                    `}

                    ${renderOutcomes(market)}
                </div>

                <footer class="card-footer">
                    <button
                        class="watch-button ${watched ? "active" : ""}"
                        data-watch-id="${escapeHtml(id)}"
                        type="button">
                        ${watched ? "Watching" : "Add to watchlist"}
                    </button>
                    ${intelligenceLink}
                </footer>
            </article>
        `;
    }

    function filteredMarkets() {
        const query = search.value.trim().toLowerCase();
        const selectedStatus = statusFilter.value;

        return markets.filter(market => {
            const leagueMatches =
                activeLeague === "ALL" ||
                marketLeague(market) === activeLeague;

            const status = marketStatus(market);
            const statusMatches =
                selectedStatus === "all" ||
                status.includes(selectedStatus);

            const searchMatches =
                !query ||
                marketTitle(market).toLowerCase().includes(query) ||
                marketLeague(market).toLowerCase().includes(query);

            return leagueMatches && statusMatches && searchMatches;
        });
    }

    function render() {
        const visible = filteredMarkets();

        count.textContent =
            `${visible.length} market${visible.length === 1 ? "" : "s"} shown`;

        if (!visible.length) {
            grid.innerHTML = `
                <div class="state-panel">
                    No markets match the selected filters.
                </div>
            `;
            return;
        }

        grid.innerHTML = visible
            .map((market, index) => renderCard(market, index))
            .join("");
    }

    grid.addEventListener("click", event => {
        const button = event.target.closest("[data-watch-id]");
        if (!button) return;

        const id = button.dataset.watchId;

        if (watchlist.has(id)) {
            watchlist.delete(id);
        } else {
            watchlist.add(id);
        }

        localStorage.setItem(
            WATCHLIST_KEY,
            JSON.stringify([...watchlist])
        );

        render();
    });

    leagueButtons.forEach(button => {
        button.addEventListener("click", () => {
            activeLeague = button.dataset.league;

            leagueButtons.forEach(item => {
                item.setAttribute(
                    "aria-pressed",
                    String(item === button)
                );
            });

            render();
        });
    });

    search.addEventListener("input", render);
    statusFilter.addEventListener("change", render);

    async function loadMarkets() {
        grid.innerHTML = `
            <div class="state-panel">Loading market intelligence…</div>
        `;

        try {
            const response = await fetch("/api/sip/markets", {
                headers: { "Accept": "application/json" }
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            markets = normalizePayload(await response.json());
            render();
        } catch (error) {
            count.textContent = "Market service unavailable";
            grid.innerHTML = `
                <div class="state-panel">
                    Unable to load SIP markets. Please retry shortly.
                </div>
            `;
            console.error("SIP market load failed:", error);
        }
    }

    loadMarkets();
})();
</script>
</body>
</html>
