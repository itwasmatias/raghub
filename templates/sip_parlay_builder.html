<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIP Parlay Builder</title>
    <link rel="stylesheet" href="/static/sip_market_ui.css?v={{ frontend_version }}" />
  </head>
  <body data-page="parlay-builder">
    <header class="topbar">
      <div class="brand">SIP Market Intelligence</div>
      <nav class="topnav" aria-label="Primary">
        <a href="/sip/markets">Markets</a>
        <a href="/sip/props">Props</a>
        <a href="/sip/parlay-builder" aria-current="page">Parlay Builder</a>
        <a href="/sip/exposure">Exposure</a>
      </nav>
      <a class="pill" href="/sip/markets">Add Legs</a>
    </header>
    <main class="detail-main">
      <h1>Parlay Builder</h1>
      <p>Persistent tray with combined pricing, implied probability, SIP estimate, and correlation warnings.</p>
      <section class="parlay-tray">
        <div id="parlay-legs" class="parlay-legs"></div>
        <div class="parlay-metrics">
          <span id="parlay-combined">Combined odds: --</span>
          <span id="parlay-implied">Naive implied probability: --</span>
          <span id="parlay-sip">SIP probability: Unavailable</span>
          <span id="parlay-warning" class="status-chip warning">No selections</span>
        </div>
      </section>
    </main>
    <script src="/static/sip_market_ui.js?v={{ frontend_version }}"></script>
  </body>
</html>
